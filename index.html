<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ভাইব চেক বিডি - ডেটিং ও চ্যাট</title>
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #ffffff;
            --tg-theme-text-color: #000000;
            --tg-theme-button-color: #2481cc;
            --tg-theme-button-text-color: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #222);
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        h2 {
            text-align: center;
            color: var(--tg-theme-button-color, #2481cc);
        }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .optional-text {
            font-size: 11px;
            color: #888;
            font-weight: normal;
        }
        button {
            width: 100%;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .hidden {
            display: none;
        }
        .profile-card {
            display: flex;
            align-items: center;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .profile-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            background: #ccc;
            margin-right: 12px;
        }
        .profile-info h4 {
            margin: 0 0 4px 0;
            font-size: 15px;
        }
        .profile-info p {
            margin: 0;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ১. প্রোফাইল রেজিস্ট্রেশন ফর্ম -->
        <div id="register-section" class="card">
            <h2>💖 ভাইব চেক বিডি</h2>
            <p style="text-align: center; font-size: 13px; color: #666; margin-top: -5px;">চ্যাট শুরু করতে আপনার প্রোফাইল তৈরি করুন</p>
            
            <div class="form-group">
                <label>আপনার নাম বা ডাকনাম</label>
                <input type="text" id="name" placeholder="যেমন: তানভীর">
            </div>
            <div class="form-group">
                <label>বয়স</label>
                <input type="number" id="age" placeholder="যেমন: ২২">
            </div>
            <div class="form-group">
                <label>শহর</label>
                <input type="text" id="city" placeholder="যেমন: ঢাকা">
            </div>
            <div class="form-group">
                <label>পেশা</label>
                <input type="text" id="profession" placeholder="যেমন: ছাত্র / চাকুরীজীবী">
            </div>
            <div class="form-group">
                <label>শখ (Hobby)</label>
                <input type="text" id="hobbies" placeholder="যেমন: গেম খেলা, ভ্রমণ, গান শোনা">
            </div>
            <div class="form-group">
                <label>প্রোফাইল ছবির লিংক <span class="optional-text">(ঐচ্ছিক)</span></label>
                <input type="text" id="photo" placeholder="https://example.com/photo.jpg">
            </div>
            <button onclick="saveProfile()">সেভ করুন ও চ্যাট শুরু করুন</button>
        </div>

        <!-- ২. ড্যাশবোর্ড বা চ্যাট ফিড সেকশন -->
        <div id="dashboard-section" class="hidden">
            <h2>🔥 সক্রিয় প্রোফাইলসমূহ</h2>
            <div class="card" style="background: #eef6fc;">
                <h3 id="welcome-user" style="margin:0 0 5px 0;">স্বাগতম!</h3>
                <p id="user-details-summary" style="margin:0; font-size:13px; color:#555;"></p>
            </div>
            
            <div id="profiles-list">
                <!-- ডেমো ম্যাচিং প্রোফাইল কার্ড -->
                <div class="profile-card">
                    <img src="https://picsum.photos/50/50?random=10" class="profile-avatar" alt="Avatar">
                    <div class="profile-info">
                        <h4>নুসরাত, ২১ • চট্টগ্রাম</h4>
                        <p>পেশা: ছাত্রী | শখ: বই পড়া</p>
                    </div>
                </div>
                <div class="profile-card">
                    <img src="https://picsum.photos/50/50?random=20" class="profile-avatar" alt="Avatar">
                    <div class="profile-info">
                        <h4>রহিম, ২৪ • সিলেট</h4>
                        <p>পেশা: ইঞ্জিনিয়ার | শখ: ফটোগ্রাফি</p>
                    </div>
                </div>
            </div>
            <button style="background-color: #e74c3c;" onclick="resetProfile()">প্রোফাইল পরিবর্তন করুন</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        window.onload = function() {
            let savedProfile = localStorage.getItem('vibecheck_bn_user');
            if (savedProfile) {
                let user = JSON.parse(savedProfile);
                showDashboard(user);
            }
        };

        function saveProfile() {
            let name = document.getElementById('name').value.trim();
            let age = document.getElementById('age').value.trim();
            let city = document.getElementById('city').value.trim();
            let profession = document.getElementById('profession').value.trim() || 'উল্লেখ করা হয়নি';
            let hobbies = document.getElementById('hobbies').value.trim() || 'সাধারণ';
            
            let photoInput = document.getElementById('photo').value.trim();
            let photo = photoInput !== "" ? photoInput : 'https://cdn-icons-png.flaticon.com/512/149/149071.png';

            if(!name || !age || !city) {
                alert('দয়া করে অন্তত নাম, বয়স এবং শহর পূরণ করুন!');
                return;
            }

            let userData = { name, age, city, profession, hobbies, photo };
            localStorage.setItem('vibecheck_bn_user', JSON.stringify(userData));
            
            showDashboard(userData);
        }

        function showDashboard(user) {
            document.getElementById('register-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('welcome-user').innerText = `স্বাগতম, ${user.name}! 👋`;
            document.getElementById('user-details-summary').innerText = `বয়স: ${user.age} বছর • শহর: ${user.city} • পেশা: ${user.profession}\nশখ: ${user.hobbies}`;
        }

        function resetProfile() {
            localStorage.removeItem('vibecheck_bn_user');
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('register-section').classList.remove('hidden');
        }
    </script>
</body>
</html>
