<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Check BD</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 0; text-align: center; }
        .hidden { display: none !important; }
        #paywall { padding: 40px 20px; max-width: 400px; margin: 50px auto; background: white; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #app-container { max-width: 500px; margin: auto; padding: 10px; }
        .banner { background: #ff4757; color: white; padding: 10px; border-radius: 8px; font-weight: bold; margin-bottom: 15px; }
        .profile-card { background: white; padding: 15px; margin: 10px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .chat-box { background: white; border-radius: 8px; padding: 10px; height: 350px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .messages { flex: 1; overflow-y: auto; text-align: left; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 10px; border-radius: 8px; max-width: 75%; word-break: break-word; }
        .msg.user { background: #0088cc; color: white; align-self: flex-end; }
        .msg.bot { background: #e4e6eb; color: black; align-self: flex-start; }
        .chat-input-area { display: flex; gap: 5px; margin-top: 10px; }
        .chat-input-area input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .chat-input-area button { padding: 10px 15px; background: #0088cc; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .btn-pay { background: #2ed573; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- পেমেন্ট ওয়াল -->
    <div id="paywall">
        <h2>🔒 প্রিমিয়াম অ্যাক্সেস</h2>
        <p>মিনি অ্যাপ ব্যবহার করতে এবং চ্যাট করতে আগে পেমেন্ট সম্পন্ন করুন।</p>
        <button class="btn-pay" onclick="verifyPayment()">টেলিগ্রাম বট পেমেন্ট সম্পন্ন করুন</button>
    </div>

    <!-- মূল মিনি অ্যাপ -->
    <div id="app-container" class="hidden">
        <div class="banner">Active people's accounts দেখা যাচ্ছে</div>
        
        <div id="profiles-view">
            <div class="profile-card">
                <span>ঝিনুক রহমান (২৩) • ঢাকা</span>
                <button onclick="openChat('ঝিনুক রহমান')" style="background:#2ed573; color:white; border:none; padding:8px 12px; border-radius:5px; cursor:pointer;">মেসেজ</button>
            </div>
            <div class="profile-card">
                <span>নুসরাত জাহান (২২) • চট্টগ্রাম</span>
                <button onclick="openChat('নুসরাত জাহান')" style="background:#2ed573; color:white; border:none; padding:8px 12px; border-radius:5px; cursor:pointer;">মেসেজ</button>
            </div>
        </div>

        <div id="chat-view" class="hidden">
            <h3 id="chat-title">চ্যাট</h3>
            <div class="chat-box">
                <div class="messages" id="msgList"></div>
                <div class="chat-input-area">
                    <input type="text" id="userInput" placeholder="কিছু একটা লিখুন...">
                    <button onclick="sendMessage()">পাঠান</button>
                </div>
            </div>
            <button onclick="backToProfiles()" style="margin-top: 15px; background: #ff4757; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">প্রোফাইলে ফিরে যান</button>
        </div>
    </div>

    <script>
        function verifyPayment() {
            localStorage.setItem("hasPaid", "true");
            checkAccess();
        }

        function checkAccess() {
            if (localStorage.getItem("hasPaid") === "true") {
                document.getElementById('paywall').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
            }
        }

        let currentChatUser = "";

        function openChat(name) {
            currentChatUser = name;
            document.getElementById('profiles-view').classList.add('hidden');
            document.getElementById('chat-view').classList.remove('hidden');
            document.getElementById('chat-title').innerText = name + "-এর সাথে চ্যাট";
            document.getElementById('msgList').innerHTML = '';
        }

        function backToProfiles() {
            document.getElementById('chat-view').classList.add('hidden');
            document.getElementById('profiles-view').classList.remove('hidden');
        }

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const message = inputField.value.trim();
            if (!message) return;

            const msgList = document.getElementById('msgList');
            
            // ইউজারের মেসেজ স্ক্রিনে যোগ করা
            msgList.innerHTML += `<div class="msg user">${message}</div>`;
            inputField.value = '';
            msgList.scrollTop = msgList.scrollHeight;

            // চেক করা যে এই চ্যাটে ইতিমধ্যে বটের রিপ্লাই দেওয়া হয়েছে কি না
            const replyKey = `replied_${currentChatUser}`;
            if (localStorage.getItem(replyKey) === "true") {
                // ইতিমধ্যে একবার উত্তর দেওয়া হয়ে থাকলে আর কোনো রিকোয়েস্ট যাবে না বা উত্তর আসবে না
                return;
            }

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, chatUserName: currentChatUser })
                });
                const data = await response.json();

                // মাত্র ১টি ইনস্ট্যান্ট রিপ্লাই দেখানো
                setTimeout(() => {
                    msgList.innerHTML += `<div class="msg bot">${data.reply}</div>`;
                    msgList.scrollTop = msgList.scrollHeight;
                    
                    // মার্ক করে দেওয়া হলো যে এই চ্যাটে রিপ্লাই দেওয়া শেষ, এরপর আর দিবে না
                    localStorage.setItem(replyKey, "true");
                }, 500);

            } catch (err) {
                console.error(err);
            }
        }

        window.onload = checkAccess;
    </script>
</body>
</html>
