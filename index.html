<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Check BD</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 0; text-align: center; }
        .hidden { display: none !important; }
        .container { max-width: 450px; margin: auto; padding: 15px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-top: 20px; text-align: left; }
        .card h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .btn-submit { background: #2ed573; color: white; border: none; padding: 12px; width: 100%; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .profile-card { background: white; padding: 15px; margin: 10px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .chat-box { background: white; border-radius: 8px; padding: 10px; height: 350px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: left; }
        .messages { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 10px; border-radius: 8px; max-width: 75%; word-break: break-word; }
        .msg.user { background: #0088cc; color: white; align-self: flex-end; }
        .msg.bot { background: #e4e6eb; color: black; align-self: flex-start; }
        .chat-input-area { display: flex; gap: 5px; margin-top: 10px; }
        .chat-input-area input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .chat-input-area button { padding: 10px 15px; background: #0088cc; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <!-- ফর্ম ভিউ -->
        <div id="form-view" class="card">
            <h2>আপনার বিবরণ দিন</h2>
            <div class="form-group">
                <label>আপনার নাম:</label>
                <input type="text" id="userName" placeholder="আপনার নাম লিখুন">
            </div>
            <div class="form-group">
                <label>বয়স:</label>
                <input type="number" id="userAge" placeholder="আপনার বয়স">
            </div>
            <div class="form-group">
                <label>শহর:</label>
                <input type="text" id="userCity" placeholder="আপনার শহরের নাম">
            </div>
            <button class="btn-submit" onclick="submitForm()">এপ্লিকেশনে প্রবেশ করুন</button>
        </div>

        <!-- প্রোফাইল লিস্ট ভিউ -->
        <div id="profiles-view" class="hidden">
            <h3>Active people's accounts</h3>
            <div class="profile-card">
                <span>মাহি খোন্দকার • ঢাকা</span>
                <button onclick="openChat('মাহি খোন্দকার')" style="background:#2ed573; color:white; border:none; padding:8px 12px; border-radius:5px; cursor:pointer;">মেসেজ</button>
            </div>
            <div class="profile-card">
                <span>সায়মা প্রিয়া • কুমিল্লা</span>
                <button onclick="openChat('সায়মা প্রিয়া')" style="background:#2ed573; color:white; border:none; padding:8px 12px; border-radius:5px; cursor:pointer;">মেসেজ</button>
            </div>
            <div class="profile-card">
                <span>পূজা চৌধুরী • গাজীপুর</span>
                <button onclick="openChat('পূজা চৌধুরী')" style="background:#2ed573; color:white; border:none; padding:8px 12px; border-radius:5px; cursor:pointer;">মেসেজ</button>
            </div>
        </div>

        <!-- চ্যাট ভিউ -->
        <div id="chat-view" class="hidden">
            <h3 id="chat-title">চ্যাট</h3>
            <div class="chat-box">
                <div class="messages" id="msgList"></div>
                <div class="chat-input-area">
                    <input type="text" id="userInput" placeholder="কিছু একটা লিখুন...">
                    <button onclick="sendMessage()">পাঠান</button>
                </div>
            </div>
            <button onclick="backToProfiles()" style="margin-top: 15px; background: #ff4757; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">প্রোফাইলে ফিরে যান</button>
        </div>
    </div>

    <script>
        function submitForm() {
            const name = document.getElementById('userName').value.trim();
            const age = document.getElementById('userAge').value.trim();
            const city = document.getElementById('userCity').value.trim();

            if (!name || !age || !city) {
                alert("দয়া করে সব তথ্য সঠিকভাবে পূরণ করুন!");
                return;
            }

            localStorage.setItem("userRegistered", "true");
            document.getElementById('form-view').classList.add('hidden');
            document.getElementById('profiles-view').classList.remove('hidden');
        }

        let currentChatUser = "";

        function openChat(name) {
            currentChatUser = name;
            document.getElementById('profiles-view').classList.add('hidden');
            document.getElementById('chat-view').classList.remove('hidden');
            document.getElementById('chat-title').innerText = name + "-এর সাথে চ্যাট";
            document.getElementById('msgList').innerHTML = '';
        }

        function backToProfiles() {
            document.getElementById('chat-view').classList.add('hidden');
            document.getElementById('profiles-view').classList.remove('hidden');
        }

        function sendMessage() {
            const inputField = document.getElementById('userInput');
            const message = inputField.value.trim();
            if (!message) return;

            const msgList = document.getElementById('msgList');
            
            // ইউজারের মেসেজ স্ক্রিনে দেখানো
            msgList.innerHTML += `<div class="msg user">${message}</div>`;
            inputField.value = '';
            msgList.scrollTop = msgList.scrollHeight;

            // পার্মানেন্ট লক চেক: এই প্রোফাইলের চ্যাটে কি অলরেডি একবার উত্তর দেওয়া হয়েছে?
            const replyKey = `locked_chat_${currentChatUser}`;
            if (localStorage.getItem(replyKey) === "true") {
                return; // যদি দেওয়া হয়ে থাকে, তবে কোড এখানেই থেমে যাবে, আর কোনো রিপ্লাই বা রিকোয়েস্ট যাবে না।
            }

            // বটের নির্দিষ্ট ফিক্সড সিঙ্গেল রিপ্লাই জেনারেট করা
            const replyText = `আপনার WhatsApp নম্বর দিয়ে রাখুন, ${currentChatUser} অনলাইন এ আসলে আপনাকে মেসেজ দিবে`;

            setTimeout(() => {
                msgList.innerHTML += `<div class="msg bot">${replyText}</div>`;
                msgList.scrollTop = msgList.scrollHeight;
                
                // সাথে সাথে চ্যাটটি লক করে দেওয়া হলো যাতে পরবর্তী হাজারটা মেসেজেও আর কোনো উত্তর না আসে
                localStorage.setItem(replyKey, "true");
            }, 400);
        }

        window.onload = function() {
            if (localStorage.getItem("userRegistered") === "true") {
                document.getElementById('form-view').classList.add('hidden');
                document.getElementById('profiles-view').classList.remove('hidden');
            }
        };
    </script>
</body>
</html>
