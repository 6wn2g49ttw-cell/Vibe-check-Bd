<div id="paywallScreen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f8f9fa; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; font-family: sans-serif;">
    <div style="background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 320px; width: 100%;">
        <h2 style="color: #333; margin-bottom: 10px;">🔒 এক্সেস লকড</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 20px;">মিনি অ্যাপ ব্যবহার করতে এবং প্রফাইল দেখতে প্রথমে ৫০ টাকা পেমেন্ট সম্পন্ন করুন।</p>
        
        <input type="text" id="userNameInput" placeholder="আপনার নাম লিখুন" style="width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box;">
        
        <button onclick="verifyPaymentAccess()" style="width: 100%; background: #2481cc; color: white; border: none; padding: 12px; font-size: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 10px;">
            ✅ পেমেন্ট ভেরিফাই করুন
        </button>
        <p style="font-size: 12px; color: #888;">বট থেকে পেমেন্ট করার পর এখানে নাম দিয়ে ভেরিফাই করুন।</p>
    </div>
</div>

<script>
    function verifyPaymentAccess() {
        const name = document.getElementById('userNameInput').value;
        if(!name) {
            alert("দয়া করে আপনার নাম লিখুন!");
            return;
        }
        
        // সাময়িকভাবে লোকালস্টোরেজে সেভ করে লক তুলে দেওয়া (পরবর্তীতে ব্যাকএন্ড পেমেন্ট ডাটাবেজ দিয়ে কানেক্ট হবে)
        localStorage.setItem("vibe_user_verified", "true");
        document.getElementById('paywallScreen').style.display = 'none';
        alert("স্বাগতম! আপনার এক্সেস আনলক করা হয়েছে।");
    }

    // পেজ লোড হওয়ার সাথে সাথে চেক করা আগে ভেরিফাই করা আছে কি না
    window.onload = function() {
        if(localStorage.getItem("vibe_user_verified") === "true") {
            document.getElementById('paywallScreen').style.display = 'none';
        }
    }
</script>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vibe Check BD</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 0; text-align: center; -webkit-text-size-adjust: 100%; }
        .hidden { display: none !important; }
        .container { max-width: 450px; margin: auto; padding: 15px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-top: 20px; text-align: left; }
        .card h2 { text-align: center; color: #333; font-size: 20px; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; font-size: 14px; }
        
        .form-group input, .form-group select { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ddd; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 16px !important; 
        }

        .btn-submit { background: #2ed573; color: white; border: none; padding: 12px; width: 100%; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .banner { background: #0088cc; color: white; padding: 10px; border-radius: 8px; font-weight: bold; margin-bottom: 15px; font-size: 14px; }
        
        .profile-card { background: white; padding: 15px; margin: 10px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: left; }
        .profile-info h4 { margin: 0 0 5px 0; color: #222; font-size: 16px; }
        .profile-info p { margin: 0; color: #666; font-size: 13px; }
        
        .chat-box { background: white; border-radius: 8px; padding: 10px; height: 350px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: left; }
        .messages { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 10px; border-radius: 8px; max-width: 75%; word-break: break-word; font-size: 15px; line-height: 1.4; }
        .msg.user { background: #0088cc; color: white; align-self: flex-end; }
        .msg.bot { background: #e4e6eb; color: black; align-self: flex-start; }
        
        .chat-input-area { display: flex; gap: 5px; margin-top: 10px; }
        .chat-input-area input { 
            flex: 1; 
            padding: 11px; 
            border: 1px solid #ddd; 
            border-radius: 5px; 
            font-size: 16px !important; 
        }
        
        .chat-input-area button { padding: 10px 15px; background: #0088cc; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <!-- ফর্ম ভিউ -->
        <div id="form-view" class="card">
            <h2>আপনার বিবরণ দিন</h2>
            <div class="form-group">
                <label>নাম:</label>
                <input type="text" id="userName" placeholder="আপনার নাম লিখুন">
            </div>
            <div class="form-group">
                <label>বয়স:</label>
                <input type="number" id="userAge" placeholder="আপনার বয়স">
            </div>
            <div class="form-group">
                <label>ঠিকানা (শহর):</label>
                <input type="text" id="userCity" placeholder="আপনার শহরের নাম">
            </div>
            <div class="form-group">
                <label>শখ:</label>
                <input type="text" id="userHobby" placeholder="যেমন: ঘুরাঘুরি, ফটোগ্রাফি">
            </div>
            <div class="form-group">
                <label>আপনার জেন্ডার:</label>
                <select id="userGender">
                    <option value="chele">ছেলে</option>
                    <option value="meye">মেয়ে</option>
                </select>
            </div>
            <div class="form-group">
                <label>কার অ্যাকাউন্ট খুঁজতে চান?</label>
                <select id="searchPreference">
                    <option value="meye">মেয়েদের অ্যাকাউন্ট (৪০০+)</option>
                    <option value="chele">ছেলেদের অ্যাকাউন্ট (২০০+)</option>
                </select>
            </div>
            <button class="btn-submit" onclick="submitForm()">এপ্লিকেশনে প্রবেশ করুন</button>
        </div>

        <!-- প্রোফাইল লিস্ট ভিউ -->
        <div id="profiles-view" class="hidden">
            <div class="banner" id="banner-text">Active people's accounts</div>
            <div id="profile-list-container" style="max-height: 500px; overflow-y: auto;">
                <!-- ডায়নামিক প্রোফাইলগুলো এখানে জেনারেট হবে -->
            </div>
        </div>

        <!-- চ্যাট ভিউ -->
        <div id="chat-view" class="hidden">
            <h3 id="chat-title" style="font-size: 18px; color: #333;">চ্যাট</h3>
            <div class="chat-box">
                <div class="messages" id="msgList"></div>
                <div class="chat-input-area">
                    <input type="text" id="userInput" placeholder="কিছু একটা লিখুন...">
                    <button onclick="sendMessage()">পাঠান</button>
                </div>
            </div>
            <button onclick="backToProfiles()" style="margin-top: 15px; background: #ff4757; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 15px; font-weight: bold; width: 100%;">প্রোফাইলে ফিরে যান</button>
        </div>
    </div>

    <script>
        // প্রফেশনগুলোর লিস্ট (মডেল, ইনফ্লুয়েন্সার, টিকটকার, ডাক্তার, ইঞ্জিনিয়ার ইত্যাদি)
        const professions = [
            "Model", "TikTok Artist", "Influencer", "Dancer", "Public Figure", 
            "Doctor", "Engineer", "Entrepreneur", "Fashion Designer", "Makeup Artist", 
            "Content Creator", "Photographer", "Host & Anchor", "Blogger", "Stylist"
        ];

        const cities = ["ঢাকা", "চট্টগ্রাম", "সিলেট", "রাজশাহী", "খুলনা", "কুমিল্লা", "বগুড়া", "রংপুর", "বরিশাল", "গাজীপুর", "নারায়ণগঞ্জ"];

        // সাধারণ ও সুন্দর বাংলাদেশি মেয়েদের নাম (কোনো সেলিব্রিটি বা অভিনেত্রী ছাড়া)
        const baseGirlNames = [
            "সায়মা রহমান", "ফারিহা জামান", "জারিন তাসনিম", "নাজিফা তাবাসসুম", "সাবিহা সুলতানা",
            "মেহনাজ হক", "তানজিম মীম", "প্রিয়াংকা সাহা", "সোহানা আক্তার", "রোদেলা ইসলাম",
            "সাদিয়া আফরিন", "লামিয়া তাবাসসুম", "রাইসা ইসলাম", "সুবহা তাসনিম", "নাদিয়া রহমান",
            "আনিকা তাবাসসুম", "মেহজাবিন প্রিয়া", "ঋতু কর্মকার", "মালিহা চৌধুরী", "সাদিয়া মিম",
            "ফারজানা ইয়াসমিন", "পূজা সাহা", "নুসরাত তাবাসসুম", "আহনাফ জেরিন", "ইশরাত জাহান",
            "মনিরা আক্তার", "সিনথিয়া ইসলাম", "তাহিয়া তাবাসসুম", "নাজিরা রহমান", "ঝিলিক রায়",
            "দিয়া সেন", "ঐশী রায়", "শম্পা আক্তার", "বর্ষা পাল", "সায়রা খান"
        ];

        // সাধারণ ও সুন্দর বাংলাদেশি ছেলেদের নাম
        const baseBoyNames = [
            "রাকিব হাসান", "তানভীর আহমেদ", "ফাহিম মুনতাসির", "সাকিব আল হাসান", "আরিফ হোসেন",
            "সিয়াম আহমেদ", "যোজন মাহমুদ", "প্রীতম দাস", "তৌহিদ হোসেন", "শাফায়েত উল্লাহ",
            "জোভান আহমেদ", "মেহরাব হোসেন", "নাঈম ইসলাম", "রিদওয়ান মালিক", "আশিকুর রহমান",
            "তানভীর সুইট", "সাব্বির রহমান", "ইমরান হাসিন", "নাবিল আহমেদ", "ফাইয়াজ আহমেদ",
            "জুবায়ের হোসেন", "সাজ্জাদুল ইসলাম", "রাহাতুল ইসলাম", "রিফাত চৌধুরী", "আকিফুজ জামান"
        ];

        function generateProfiles(baseNames, genderType, totalCount) {
            let list = [];
            for (let i = 1; i <= totalCount; i++) {
                let randomNameBase = baseNames[(i - 1) % baseNames.length];
                let uniqueName = i > baseNames.length ? `${randomNameBase} ${i}` : randomNameBase;
                let randomCity = cities[i % cities.length];
                let randomProf = professions[i % professions.length];
                let randomAge = 18 + (i % 9);

                list.push({
                    name: uniqueName,
                    gender: genderType,
                    details: `${randomAge} বছর • ${randomCity}`,
                    profession: randomProf
                });
            }
            return list;
        }

        const allProfiles = [
            ...generateProfiles(baseGirlNames, "meye", 420),
            ...generateProfiles(baseBoyNames, "chele", 220)
        ];

        function submitForm() {
            const name = document.getElementById('userName').value.trim();
            const age = document.getElementById('userAge').value.trim();
            const city = document.getElementById('userCity').value.trim();
            const hobby = document.getElementById('userHobby').value.trim();
            const preference = document.getElementById('searchPreference').value;

            if (!name || !age || !city || !hobby) {
                alert("দয়া করে ফর্মের সব ঘর সঠিকভাবে পূরণ করুন!");
                return;
            }

            localStorage.setItem("userRegistered", "true");
            localStorage.setItem("searchPreference", preference);

            loadProfiles(preference);

            document.getElementById('form-view').classList.add('hidden');
            document.getElementById('profiles-view').classList.remove('hidden');
        }

        function loadProfiles(preference) {
            const container = document.getElementById('profile-list-container');
            container.innerHTML = "";

            const filtered = allProfiles.filter(p => p.gender === preference);
            
            document.getElementById('banner-text').innerText = `Active people's accounts (${filtered.length}+ Available)`;

            filtered.forEach(profile => {
                container.innerHTML += `
                    <div class="profile-card">
                        <div class="profile-info">
                            <h4>${profile.name}</h4>
                            <p><b>${profile.profession}</b></p>
                            <p>${profile.details}</p>
                        </div>
                        <button onclick="openChat('${profile.name}')" style="background:#2ed573; color:white; border:none; padding:8px 14px; border-radius:5px; cursor:pointer; font-weight:bold;">মেসেজ</button>
                    </div>
                `;
            });
        }

        let currentChatUser = "";

        function openChat(name) {
            currentChatUser = name;
            document.getElementById('profiles-view').classList.add('hidden');
            document.getElementById('chat-view').classList.remove('hidden');
            document.getElementById('chat-title').innerText = name + "-এর সাথে চ্যাট";
            document.getElementById('msgList').innerHTML = '';
        }

        function backToProfiles() {
            document.getElementById('chat-view').classList.add('hidden');
            document.getElementById('profiles-view').classList.remove('hidden');
        }

        function sendMessage() {
            const inputField = document.getElementById('userInput');
            const message = inputField.value.trim();
            if (!message) return;

            const msgList = document.getElementById('msgList');
            msgList.innerHTML += `<div class="msg user">${message}</div>`;
            inputField.value = '';
            msgList.scrollTop = msgList.scrollHeight;

            const replyKey = `locked_chat_${currentChatUser}`;
            if (localStorage.getItem(replyKey) === "true") {
                return; 
            }

            const replyText = `আপনার হোয়াটসঅ্যাপ নম্বরটি শেয়ার করুন। ${currentChatUser} এখন অফলাইনে আছেন, অনলাইন এ আসলে উনি আপনাকে নক করবেন।`;

            setTimeout(() => {
                msgList.innerHTML += `<div class="msg bot">${replyText}</div>`;
                msgList.scrollTop = msgList.scrollHeight;
                localStorage.setItem(replyKey, "true");
            }, 400);
        }

        window.onload = function() {
            if (localStorage.getItem("userRegistered") === "true") {
                const preference = localStorage.getItem("searchPreference") || "meye";
                loadProfiles(preference);
                document.getElementById('form-view').classList.add('hidden');
                document.getElementById('profiles-view').classList.remove('hidden');
            }
        };
    </script>
</body>
</html>
