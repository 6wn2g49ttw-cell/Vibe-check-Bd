<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ভাইব চেক বিডি - ডেটিং ও চ্যাট</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #ffffff;
            --tg-theme-text-color: #000000;
            --tg-theme-button-color: #2481cc;
            --tg-theme-button-text-color: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #222);
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        h2 {
            text-align: center;
            color: var(--tg-theme-button-color, #2481cc);
        }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .optional-text {
            font-size: 11px;
            color: #888;
            font-weight: normal;
        }
        button {
            width: 100%;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .hidden {
            display: none;
        }
        .profile-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .profile-left {
            display: flex;
            align-items: center;
        }
        .profile-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            background: #ccc;
            margin-right: 10px;
        }
        .profile-info h4 {
            margin: 0 0 2px 0;
            font-size: 14px;
        }
        .profile-info p {
            margin: 0;
            font-size: 11px;
            color: #666;
        }
        .chat-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            width: auto;
            margin-top: 0;
        }
        /* চ্যাট উইন্ডো স্টাইল */
        .chat-box {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 10px;
            margin-top: 15px;
        }
        .chat-messages {
            height: 150px;
            overflow-y: auto;
            border-bottom: 1px solid #eee;
            margin-bottom: 10px;
            padding: 5px;
            font-size: 13px;
        }
        .chat-input-area {
            display: flex;
            gap: 5px;
        }
        .chat-input-area input {
            margin-top: 0;
        }
        .chat-input-area button {
            width: 80px;
            margin-top: 0;
            padding: 8px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ১. প্রোফাইল রেজিস্ট্রেশন ফর্ম -->
        <div id="register-section" class="card">
            <h2>💖 ভাইব চেক বিডি</h2>
            <p style="text-align: center; font-size: 13px; color: #666; margin-top: -5px;">চ্যাট শুরু করতে আপনার প্রোফাইল তৈরি করুন</p>
            
            <div class="form-group">
                <label>আপনার নাম বা ডাকনাম</label>
                <input type="text" id="name" placeholder="যেমন: তানভীর">
            </div>
            <div class="form-group">
                <label>বয়স</label>
                <input type="number" id="age" placeholder="যেমন: ২২">
            </div>
            <div class="form-group">
                <label>শহর</label>
                <input type="text" id="city" placeholder="যেমন: ঢাকা">
            </div>
            <div class="form-group">
                <label>পেশা</label>
                <input type="text" id="profession" placeholder="যেমন: ছাত্র">
            </div>
            <div class="form-group">
                <label>শখ (Hobby)</label>
                <input type="text" id="hobbies" placeholder="যেমন: গেম, ভ্রমণ">
            </div>
            <div class="form-group">
                <label>প্রোফাইল ছবির লিংক <span class="optional-text">(ঐচ্ছিক)</span></label>
                <input type="text" id="photo" placeholder="https://example.com/photo.jpg">
            </div>
            <button onclick="saveProfile()">সেভ করুন ও চ্যাট শুরু করুন</button>
        </div>

        <!-- ২. ড্যাশবোর্ড বা চ্যাট ফিড সেকশন -->
        <div id="dashboard-section" class="hidden">
            <h2>🔥 সক্রিয় প্রোফাইলসমূহ</h2>
            <div class="card" style="background: #eef6fc;">
                <h3 id="welcome-user" style="margin:0 0 5px 0;">স্বাগতম!</h3>
                <p id="user-details-summary" style="margin:0; font-size:13px; color:#555;"></p>
            </div>
            
            <div id="profiles-list">
                <!-- প্রোফাইল কার্ড ১ -->
                <div class="profile-card">
                    <div class="profile-left">
                        <img src="https://picsum.photos/50/50?random=10" class="profile-avatar" alt="Avatar">
                        <div class="profile-info">
                            <h4>নুসরাত, ২১ • চট্টগ্রাম</h4>
                            <p>ছাত্রী | শখ: বই পড়া</p>
                        </div>
                    </div>
                    <button class="chat-btn" onclick="openChat('নুসরাত')">মেসেজ</button>
                </div>

                <!-- প্রোফাইল কার্ড ২ -->
                <div class="profile-card">
                    <div class="profile-left">
                        <img src="https://picsum.photos/50/50?random=20" class="profile-avatar" alt="Avatar">
                        <div class="profile-info">
                            <h4>রহিম, ২৪ • সিলেট</h4>
                            <p>ইঞ্জিনিয়ার | শখ: ফটোগ্রাফি</p>
                        </div>
                    </div>
                    <button class="chat-btn" onclick="openChat('রহিম')">মেসেজ</button>
                </div>
            </div>

            <!-- চ্যাট বক্স (মেসেজ বাটনে ক্লিক করলে শো হবে) -->
            <div id="chat-box-container" class="chat-box hidden">
                <h4 id="chat-with-title" style="margin: 0 0 8px 0; color: #2481cc; font-size: 14px;">Chat</h4>
                <div class="chat-messages" id="chat-messages-area">
                    <p style="color: #888; text-align: center; margin-top: 50px;">কথোপকথন শুরু করুন...</p>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="msg-input" placeholder="লুকিয়ে কিছু লিখুন...">
                    <button onclick="sendMessage()">পাঠান</button>
                </div>
            </div>

            <button style="background-color: #e74c3c; margin-top: 15px;" onclick="resetProfile()">প্রোফাইল পরিবর্তন করুন</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        window.onload = function() {
            let savedProfile = localStorage.getItem('vibecheck_bn_user');
            if (savedProfile) {
                let user = JSON.parse(savedProfile);
                showDashboard(user);
            }
        };

        function saveProfile() {
            let name = document.getElementById('name').value.trim();
            let age = document.getElementById('age').value.trim();
            let city = document.getElementById('city').value.trim();
            let profession = document.getElementById('profession').value.trim() || 'উল্লেখ করা হয়নি';
            let hobbies = document.getElementById('hobbies').value.trim() || 'সাধারণ';
            
            let photoInput = document.getElementById('photo').value.trim();
            let photo = photoInput !== "" ? photoInput : 'https://cdn-icons-png.flaticon.com/512/149/149071.png';

            if(!name || !age || !city) {
                alert('দয়া করে অন্তত নাম, বয়স এবং শহর পূরণ করুন!');
                return;
            }

            let userData = { name, age, city, profession, hobbies, photo };
            localStorage.setItem('vibecheck_bn_user', JSON.stringify(userData));
            
            showDashboard(userData);
        }

        function showDashboard(user) {
            document.getElementById('register-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('welcome-user').innerText = `স্বাগতম, ${user.name}! 👋`;
            document.getElementById('user-details-summary').innerText = `বয়স: ${user.age} বছর • শহর: ${user.city} • পেশা: ${user.profession}\nশখ: ${user.hobbies}`;
        }

        function resetProfile() {
            localStorage.removeItem('vibecheck_bn_user');
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('register-section').classList.remove('hidden');
        }

        function openChat(name) {
            document.getElementById('chat-box-container').classList.remove('hidden');
            document.getElementById('chat-with-title').innerText = `${name}-এর সাথে চ্যাট`;
            document.getElementById('chat-messages-area').innerHTML = `<p style="color: #888; text-align: center; font-size: 12px;">${name}-এর সাথে চ্যাট শুরু হয়েছে...</p>`;
        }

        function sendMessage() {
            let input = document.getElementById('msg-input');
            let text = input.value.trim();
            if(!text) return;

            let msgArea = document.getElementById('chat-messages-area');
            msgArea.innerHTML += `<div style="text-align: right; margin-bottom: 5px;"><span style="background: #2481cc; color: white; padding: 5px 10px; border-radius: 8px; display: inline-block; font-size: 12px;">${text}</span></div>`;
            input.value = "";
            msgArea.scrollTop = msgArea.scrollHeight;

            // অটো রিপ্লাই সিমুলেশন (মজার জন্য)
            setTimeout(() => {
                msgArea.innerHTML += `<div style="text-align: left; margin-bottom: 5px;"><span style="background: #e5e5ea; color: black; padding: 5px 10px; border-radius: 8px; display: inline-block; font-size: 12px;">হাই! কেমন আছেন? 😊</span></div>`;
                msgArea.scrollTop = msgArea.scrollHeight;
            }, 1000);
        }
    </script>
</body>
</html>
